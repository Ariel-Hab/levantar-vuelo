# 127.0.0.11 es el DNS interno de Docker. Con "valid=5s" nginx vuelve a resolver
# "app" cada 5 segundos, así se entera si un nodo se cae o aparece uno nuevo.
resolver 127.0.0.11 valid=5s;

server {
    listen 4000;

    location / {
        # Si el destino fuera un nombre fijo, nginx lo resolvería una sola vez al
        # arrancar. Con una variable lo resuelve en cada pedido (usando el resolver).
        set $upstream http://app:4000;
        proxy_pass $upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Para SSE (hito 5): no acumular la respuesta y no cortar conexiones largas.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
